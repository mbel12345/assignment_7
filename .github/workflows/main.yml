name: Run Tests on Push or Pull Request to Main

on:
  push:
    branches:
      - '**'  # Run tests on push to any branch, so that features are validated before merging into main
  pull_request:
    branches:
      - main  # Run tests on any pull request to the main branch

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'  # Set your desired Python version

      - name: Install dependencies from requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build container
        run: |
          docker build -t qr-code-generator-app .
          docker run -d --name qr-generator -v ./qr_codes:/app/qr_codes qr-code-generator-app --url http://www.njit.edu
          docker logs qr-generator

      - name: Check which files were generated in the container
        run: |
          docker exec qr-generator ls -l /app
          docker exec qr-generator ls -l /app/qr_codes

      - name: Check that QR code was generated
        run: |
          ls -l qr_codes/*

      - name: Check that QR code is valid
        run: |
          sudo apt-get update && sudo apt-get install -y zbar-tools
          _FILE=$(ls -1 qr_codes/* | head -n 1)
          echo "Validate $_FILE"
          zbarimg $_FILE
